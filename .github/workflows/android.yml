name: Android build, test and release
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**', 'LICENSE']
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        type: string
        default: '1.0.0'
      publish:
        description: Publish a GitHub release after all tests pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
env:
  APP_VERSION: ${{ inputs.version || '1.0.0' }}
jobs:
  build:
    name: Unit tests, lint and signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
        with:
          gradle-version: '8.13'
          cache-read-only: false
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate release version
        run: '[[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]'
      - name: Restore signing key in ephemeral runner only
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
      - name: Check JUnit repository availability
        run: |
          curl --fail --retry 3 -I https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.pom || true
          curl --fail --retry 3 -I https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.pom || true
      - name: Test, lint and build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --refresh-dependencies --stacktrace -PappVersion="$APP_VERSION" -PbuildNumber="$GITHUB_RUN_NUMBER" :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Verify APK signature and prepare delivery
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/GPS-tool-new-$APP_VERSION.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "dist/GPS-tool-new-$APP_VERSION.apk" > dist/signature.txt
          grep -i '5e3aaec69a37f7e7d4d0b0509a0bc0994852732b9a7f03ceb060b742d4e08983' dist/signature.txt
          cd dist && sha256sum *.apk > SHA256SUMS.txt
      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GPS-tool-new-release
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Upload test, lint and schema reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/schemas/
            app/build/outputs/mapping/release/
          retention-days: 30
      - name: Remove ephemeral private key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
  android-test:
    name: Android 16 emulator smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
        with:
          gradle-version: '8.13'
          cache-read-only: true
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable KVM on GitHub hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented UI and database checks
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/emulator-test.sh
      - name: Upload Android test results and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-16-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            emulator-artifacts/
          retention-days: 30
  release:
    name: Publish installable APK
    needs: [build, android-test]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: GPS-tool-new-release
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$APP_VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "GPS 工具箱 v$APP_VERSION" --notes-file docs/RELEASE.md
